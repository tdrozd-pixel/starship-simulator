<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship Simulator Truth View</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%276%27 y=%272%27 width=%274%27 height=%2712%27 fill=%27%23ccc%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/hud.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="panel" id="status">
    <div><span id="conn" class="badge amber">CONNECTING</span></div>
    <div>Run <span id="run">#-</span></div>
    <div>Scenario <span id="scenario">-</span></div>
    <div>Time scale <span id="timescale">x1.0</span></div>
  </div>
  <div class="panel" id="met">T+--:--.-</div>
  <div class="panel" id="telemetry">
    <div class="title">TRUTH VIEW</div>
    <table>
      <tr><td>ALT (m)</td><td id="t-alt">-</td></tr>
      <tr><td>V SPEED (m/s)</td><td id="t-vs">-</td></tr>
      <tr><td>THROTTLE (%)</td><td id="t-thr">-</td></tr>
      <tr><td>GIMBAL PITCH (deg)</td><td id="t-gp">-</td></tr>
      <tr><td>GIMBAL YAW (deg)</td><td id="t-gy">-</td></tr>
      <tr><td>ATT X (deg)</td><td id="t-ax">-</td></tr>
      <tr><td>ATT Y (deg)</td><td id="t-ay">-</td></tr>
      <tr><td>ATT Z (deg)</td><td id="t-az">-</td></tr>
      <tr><td>PROP (kg)</td><td id="t-prop">-</td></tr>
      <tr><td>MASS (kg)</td><td id="t-mass">-</td></tr>
    </table>
    <div class="lamps">
      <span id="lamp-engine" class="lamp">ENGINE</span>
      <span id="lamp-td" class="lamp">TOUCHDOWN</span>
      <span id="lamp-fin" class="lamp">RUN FINISHED</span>
    </div>
    <div id="waiting">waiting for data</div>
  </div>
  <div id="buttons">
    <button id="btn-restart" disabled>Restart</button>
    <button id="btn-reset">Reset view (R)</button>
  </div>
  <div id="banner"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
