<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship GNC Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%276%27 y=%272%27 width=%274%27 height=%2712%27 fill=%27%2335d7ff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="gnc.css">
<script type="importmap">{ "imports": { "uplot": "../vendor/uplot/uPlot.esm.js" } }</script>
</head>
<body>
<header id="bar">
  <div class="pos">GNC</div>
  <div class="met" data-k="met">T+--:--.-</div>
  <div id="attitude-mini" title="Interpolated NAV attitude: pitch and roll">
    <canvas id="attitude-mini-canvas" aria-label="Pitch and roll attitude indicator"></canvas>
  </div>
  <div class="modebox">
    <span class="badge" id="mode-badge" data-k="mode">--</span>
    <div class="tl" title="Flight computer mode timeline (onboard time)"><canvas id="timeline"></canvas></div>
  </div>
  <div class="pop-anchor">
    <button class="chip" id="regime-btn" aria-haspopup="true" aria-expanded="false" title="Flight regime (phase of flight)">PHASE <b id="regime-label">--</b> &#9662;</button>
    <div class="pop" id="regime-pop" hidden></div>
  </div>
  <button class="chip" id="follow-btn" aria-pressed="true" title="Follow the flight phase automatically">FOLLOW PHASE: ON</button>
  <span id="notice" class="notice" role="status"></span>
  <!-- TODO(phase 10, item 48): alarm and caution banner fed by the ground service limits. -->
  <div id="alarm-slot" class="alarm-slot" aria-live="polite"></div>
  <div class="link">
    <span id="conn" class="badge amber">CONNECTING</span>
    <span>LOSS <b data-k="linkLoss">--</b>%</span>
    <span>LAT <b data-k="linkLat">--</b> ms</span>
  </div>
  <div class="chip" id="gnss-chip" title="GNSS fix, satellites used/visible, horizontal distance from pad center">GNSS <b data-k="gnssChip">--</b></div>
  <div class="pop-anchor">
    <button class="chip" id="stale-btn" aria-haspopup="true" aria-expanded="false" title="Packet staleness">TLM --</button>
    <div class="pop" id="stale-pop" hidden></div>
  </div>
  <div class="pop-anchor">
    <button class="chip" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">&#9776;</button>
    <div class="pop" id="menu" hidden>
      <label>Chart window
        <select id="win" aria-label="Chart window">
          <option value="30">30 s</option><option value="60" selected>60 s</option><option value="120">120 s</option>
        </select>
      </label>
      <label>Gimbal engine
        <select id="eng" aria-label="Gimbal chart engine">
          <option value="0" selected>1</option><option value="1">2</option><option value="2">3</option><option value="all">all</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="perf-toggle"> Performance readout</label>
      <button id="clear-btn">Clear history</button>
      <div class="note">RUN <b data-k="run">#-</b></div>
    </div>
  </div>
</header>

<nav id="tabs" role="tablist" aria-label="Console screens"></nav>
<main id="screen-host"></main>
<script type="module" src="../js/gnc/gncMain.js"></script>
</body>
</html>
